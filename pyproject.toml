
[project]
name = "nanover-extensions-lammps"
import-namespace = ["nanover-extensions"]
import-names = ["nanover_extensions.lammps"]
version = "0.1.0"
description = "LAMMPS engine interface for NanoVer"
authors = [{ name = "Thomas Regan", email = "thomas.regan@bristol.ac.uk" }]
maintainers = [{ name = "BristolChemVR", email = "chem-vr@bristol.ac.uk" }]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["python"]
requires-python = ">=3.12,<4"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "nanover-server",
    "lammps",
    "numpy",
    "typer",
]


[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "nox>=2026.2.9",
    "pytest>=9.0.2",
    "coverage>=7.15.2",
    "ruff>=0.16.2",
    "taskipy>=1.14.1",
    "portray>=1.8.0",
    "legacy-cgi>=2.6.3",
    "setuptools>=80.9.0",
    "pre-commit>=4.2.0",
]


[project.scripts]
next-lammps = "nanover_extensions.lammps.cli.main:main"

[project.urls]
homepage = "https://github.com/BristolChemVR/nanover-extensions-lammps"
repository = "https://github.com/BristolChemVR/nanover-extensions-lammps.git"
documentation = "https://BristolChemVR.github.io/nanover-extensions-lammps"
issues = "https://github.com/BristolChemVR/nanover-extensions-lammps/issues"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["nanover_extensions.lammps"]

[tool.taskipy.tasks]
format = { cmd = "ruff format ./src/", help = "Format code using ruff" }
lint = { cmd = "ruff check --config pyproject.toml --fix", help = "Lint code using ruff" }
type = { cmd = "mypy --config-file pyproject.toml", help = "Typecheck code using mypy" }
docs = { cmd = "portray in_browser", help = "Serve documentation in browser" }
serve = { cmd = "portray server", help = "Serve documentation" }
html = { cmd = "portray as_html", help = "Build HTML documentation" }
publish = { cmd = "portray on_github_pages", help = "Publish documentation on GitHub Pages" }
tests = { cmd = "pytest --verbose --color=yes tests", help = "Run all tests using pytest" }
coverage = { cmd = "coverage run -m pytest tests && coverage report", help = "Generate coverage report" }
run = { cmd = "uv run ./src/nanover_extensions_lammps/nanover_extensions_lammps.py", help = "Run main application" }
upgrade = { cmd = "uv sync --upgrade", help = "Upgrade all dependencies to lastest versions."}

[tool.ruff]
line-length = 100
indent-width = 4
format.indent-style = "space"
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
pydocstyle.convention = "google"
fixable = ["ALL"]
select = ["ALL"]
ignore = [
    "FA102", # Flake8-future-annotations
    "F401", # Disable fix for unused imports
    "B904", # Allow raising exceptions without from e
    "PLR0913", # too many arguments
    "CPY", # Flake8-copyright
    "T201", # Debugging print statements
    "ERA", # Eradicate – detects commented-out code
    "BLE001", # Catch-all exceptions
    "D100", # missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # undocumented magic method
    "D107", # undocumented public init
    "D203", # incorrect-blank-line-before-class
    "D205", # line-between-summary-and-description
    "D212", # multi-line-summary-first-line
    "D400", # missing-trailing-period
    "D407", # missing-dashed-underline-after-section
    "S311", # rand-usage
    "EM102", # f-string-exception
    "TRY003", # long-exception-messages
    "COM812", # Ignore missing trailing comma.
    "E501", # Ignore line length - using black for formatting.
    "ISC002", # Ignore implicitly concatenated string literals - using black for formatting
    "ANN401", # Ignore disallow `typing.Any` as parameter.
    "ARG002", # Ignore unused arguments
    "TD003", # Ignore missing issue link in TODO - most repos are initial phase of development
    "FIX002", # Ignore TODO not fixed - most repos are initial phase of development
    "PLR0917", # Ignore too many positional arguements on a callback function
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"tests/**" = ["S101", "D1", "ANN", "PLR2004", "INP001"]
"src/nanover_extensions/lammps/cli/lammps_cli.py" = [ "FBT002", "PTH207"]

[tool.ruff.lint.mccabe]
max-complexity=12

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 10

[tool.coverage.run]
branch = true
source = ["nanover_extensions.lammps"]
omit = ["_*.py", "__*.py"]

[tool.portray.mkdocs]
site_name = "nanover-extensions-lammps"

[tool.portray.mkdocs.theme]
name = "material"
custom_dir = "docs"
palette = {scheme= "slate", primary="deep purple", accent="purple"}
